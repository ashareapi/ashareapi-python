[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashareapi"
version = "0.1.10"
description = "A股数据 API 官方 Python SDK —— 行情 / K线 / 财务 / 资金 / 龙虎榜 / 板块 / 因子选股（32 端点，免费端点无需 Key）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ashareapi" }]
keywords = ["a-share", "ashare", "stock", "quant", "finance", "mcp", "stock-data-api", "financial-data-api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://ashareapi.com"
Documentation = "https://ashareapi.com/docs/"
"Endpoint list" = "https://ashareapi.com/endpoints/"
Changelog = "https://ashareapi.com/changelog"
Repository = "https://github.com/ashareapi/ashareapi-python"
Issues = "https://github.com/ashareapi/ashareapi-python/issues"

[tool.setuptools]
# CHANGELOG.md 要进 sdist（PyPI 页面会渲染 README，但 changelog 供查阅）
include-package-data = true
